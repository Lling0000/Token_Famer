name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CI: 'true'
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/token_farmer_test
  REDIS_URL: redis://127.0.0.1:6379/0
  BETTER_AUTH_SECRET: ci-only-auth-secret-ci-only-auth-secret
  API_KEY_PEPPER: ci-only-api-key-pepper-ci-only-api-key-pepper
  FIELD_ENCRYPTION_KEY: ci-only-field-encryption-key-32-bytes
  UPSTREAM_MODE: mock
  TEAMOROUTER_RESALE_APPROVED: 'false'
  CORS_ORIGIN: http://127.0.0.1:3000

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm todo:check
      - run: pnpm duplication:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  property:
    name: property
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:property

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm architecture:check

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: token_farmer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d token_farmer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm test:integration

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: token_farmer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d token_farmer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm test:contract

  migration:
    name: migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: token_farmer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d token_farmer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate:deploy
      - run: pnpm db:check

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  playwright-smoke:
    name: playwright-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: token_farmer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d token_farmer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  pr-size:
    name: pr-size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce effective code limit
        uses: actions/github-script@v9
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const approved = labels.some(
              (label) => label.name === 'large-change-approved',
            );
            if (approved) {
              core.notice('PR size gate bypassed by large-change-approved.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const source = /\.(?:ts|tsx|js|jsx|mjs|cjs|css|scss|sql)$/;
            const excluded = [
              /^database\/migrations\//,
              /(?:^|\/)generated(?:\/|\.)/,
              /\.generated\./,
              /^apps\/web\/public\/assets\//,
              /(?:^|\/)config\/versions\//,
              /^docs\//,
              /^\.github\//,
            ];

            const counted = files
              .filter((file) => source.test(file.filename))
              .filter((file) => !excluded.some((pattern) => pattern.test(file.filename)))
              .map((file) => ({
                file: file.filename,
                lines: file.additions + file.deletions,
              }));

            const total = counted.reduce((sum, file) => sum + file.lines, 0);
            const detail = counted
              .sort((a, b) => b.lines - a.lines)
              .slice(0, 20)
              .map((file) => `${file.lines.toString().padStart(5)} ${file.file}`)
              .join('\n');

            core.summary
              .addHeading('Effective PR code size')
              .addRaw(`Counted additions and deletions: **${total} / 500**\n\n`)
              .addCodeBlock(detail || 'No counted source files', 'text');
            await core.summary.write();

            if (total > 500) {
              core.setFailed(
                `Effective code change is ${total} lines. Split the PR or obtain the large-change-approved label.`,
              );
            }
